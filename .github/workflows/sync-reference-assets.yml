name: Sync original SVG animation style
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<12'
      - name: Import exact original SVGs and adapt personal details
        run: python scripts/build_from_reference.py --permission-confirmed
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ README.md
          if ! git diff --staged --quiet; then
            git commit -m 'Use original SVG animation style with Dai Thang AWS badges'
            git push
          fi
