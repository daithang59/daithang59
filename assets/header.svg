<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="314" viewBox="0 0 1120 314" role="img" aria-labelledby="title desc">
<title id="title">Dai Thang — AWS Cloud and DevOps Engineer</title>
<desc id="desc">A minimal dark grid banner with a moving amber signal and an understated architectural wave.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101421"/><stop offset="1" stop-color="#20283C"/></linearGradient>
  <pattern id="grid" width="39" height="39" patternUnits="userSpaceOnUse"><path d="M39 0H0V39" stroke="#77839d" stroke-width="0.7" opacity=".13" fill="none"/></pattern>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900" stop-opacity="0"/><stop offset=".45" stop-color="#ff9900" stop-opacity=".75"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="1120" height="314" rx="8"/></clipPath>
</defs>
<style>
  .tiny { font-family: 'Consolas','DejaVu Sans Mono',monospace; font-size:11px; letter-spacing:1.6px; fill:#94A1B9; }
  .head { font-family: 'Segoe UI','DejaVu Sans',Arial,sans-serif; font-size:73px; font-weight:750; letter-spacing:-2.8px; fill:#F5F7FC; }
  .sub { font-family: 'Consolas','DejaVu Sans Mono',monospace; font-size:17px; letter-spacing:3px; fill:#FFB14D; }
  .signal { animation: signal 7.5s ease-in-out infinite; }
  .wave { animation: wave 8s ease-in-out infinite alternate; transform-origin:560px 270px; }
  @keyframes signal { 0%,100%{opacity:.2;transform:translateX(-60px)} 50%{opacity:.9;transform:translateX(75px)} }
  @keyframes wave { from{transform:translateY(0px)} to{transform:translateY(6px)} }
</style>
<g clip-path="url(#frame)">
  <rect width="1120" height="314" fill="url(#back)"/>
  <rect width="1120" height="314" fill="url(#grid)"/>
  <path d="M44 45H1080" stroke="#8792A9" stroke-opacity=".17"/>
  <circle cx="57" cy="25" r="4" fill="#FF9900"/>
  <text class="tiny" x="72" y="30">DAITHANG59  /  ENGINEERING PROFILE</text>
  <text class="tiny" x="1076" y="30" text-anchor="end">HO CHI MINH CITY  ·  UTC+07</text>
  <text class="head" x="560" y="148" text-anchor="middle">Dai Thang</text>
  <text class="sub" x="560" y="191" text-anchor="middle">CLOUD  /  DEVOPS  /  DEVSECOPS</text>
  <path d="M0 242 Q265 192 546 245 T1120 238 L1120 314 H0Z" fill="#131723" opacity=".81" class="wave"/>
  <path d="M0 242 Q265 192 546 245 T1120 238" fill="none" stroke="#B7C0D1" stroke-opacity=".35" stroke-width="1.25" class="wave"/>
  <path d="M0 255 Q290 210 566 254 T1120 242" fill="none" stroke="url(#stroke)" stroke-width="1.7" class="signal"/>
  <text class="tiny" x="60" y="288">AUTOMATE THE REPEATABLE. OBSERVE THE UNKNOWN.</text>
  <text class="tiny" x="1070" y="288" text-anchor="end">AWS  /  TERRAFORM  /  KUBERNETES</text>
  <path d="M60 302H1060" stroke="#8893A9" stroke-opacity=".12"/>
</g>
</svg>