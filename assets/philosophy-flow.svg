 .b6{animation:box6 7s linear infinite} .w6{animation:word6 7s linear infinite} .i6{animation:icon6 7s linear infinite}
@media(prefers-reduced-motion:reduce){.node,.txt,.ico,.wire-glow,.wire-core{animation:none!important}}</style>
