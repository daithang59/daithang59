 .b5{animation:box5 7s linear infinite} .w5{animation:word5 7s linear infinite} .i5{animation:icon5 7s linear infinite}

 @keyframes box6 {0%,100%{fill:#0d1117;stroke:#30363d;filter:none}87.014%{fill:#161b22;stroke:#50d8dc;filter:drop-shadow(0px 0px 4px #50d8dc)}91.914%{fill:#161b22;stroke:#50d8dc;filter:drop-shadow(0px 0px 6px #50d8dc)}97.914%{fill:#0d1117;stroke:#30363d;filter:none}}
