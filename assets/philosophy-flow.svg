@keyframes textlight0 {0%,100% {fill:#8b949e} 6%,16% {fill:#fff} 22% {fill:#8b949e}}
@keyframes iconlight0 {0%,100% {stroke:#8b949e;opacity:.3;transform:translateY(0)} 6%,16% {stroke:#ff9900;opacity:1;transform:translateY(-2px)} 22% {stroke:#8b949e;opacity:.3;transform:translateY(0)}}
