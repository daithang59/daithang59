<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 142" width="100%" role="img" aria-label="Seven-stage engineering workflow with continuously moving signals and sequential node highlights">
<defs><filter id="line-blur" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="3.6"/></filter></defs>
<style>
 .wire{stroke:#262c34;stroke-width:4;fill:none;stroke-linecap:round}
 .wire-glow{stroke:#ff9900;stroke-width:9;opacity:.50;filter:url(#line-blur);stroke-dasharray:86 900;stroke-dashoffset:1000;animation:runner 7s linear infinite;stroke-linecap:round;fill:none}
 .wire-core{stroke:#ffb23b;stroke-width:3;stroke-dasharray:86 900;stroke-dashoffset:1000;animation:runner 7s linear infinite;stroke-linecap:round;fill:none}
 @keyframes runner {from{stroke-dashoffset:1000} to{stroke-dashoffset:0}}
 .node {fill:#0d1117;stroke:#30363d;stroke-width:2}
 .txt{fill:#8b949e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle}
 .ico{fill:none;stroke:#8b949e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.30;transform-box:fill-box;transform-origin:center}

 @keyframes box0 {0%,100%{fill:#0d1117;stroke:#30363d;filter:none}1.3%{fill:#161b22;stroke:#ff9900;filter:drop-shadow(0px 0px 4px #ff9900)}6.2%{fill:#161b22;stroke:#ff9900;filter:drop-shadow(0px 0px 6px #ff9900)}12.2%{fill:#0d1117;stroke:#30363d;filter:none}}
 @keyframes word0 {0%,100%{fill:#8b949e}6.2%{fill:#fff}12.2%{fill:#8b949e}}
 @keyframes icon0 {0%,100%{opacity:.30;stroke:#8b949e;transform:translateY(0) scale(1)}6.2%{opacity:1;stroke:#ff9900;transform:translateY(-3px) scale(1.08);filter:drop-shadow(0px 0px 3px #ff9900)}12.2%{opacity:.30;stroke:#8b949e;transform:translateY(0) scale(1);filter:none}}
 .b0{animation:box0 7s linear infinite} .w0{animation:word0 7s linear infinite} .i0{animation:icon0 7s linear infinite}

 @keyframes box1 {0%,100%{fill:#0d1117;stroke:#30363d;filter:none}15.586%{fill:#161b22;stroke:#2496ed;filter:drop-shadow(0px 0px 4px #2496ed)}20.486%{fill:#161b22;stroke:#2496ed;filter:drop-shadow(0px 0px 6px #2496ed)}26.486%{fill:#0d1117;stroke:#30363d;filter:none}}
 @keyframes word1 {0%,100%{fill:#8b949e}20.486%{fill:#fff}26.486%{fill:#8b949e}}
 @keyframes icon1 {0%,100%{opacity:.30;stroke:#8b949e;transform:translateY(0) scale(1)}20.486%{opacity:1;stroke:#2496ed;transform:translateY(-3px) scale(1.08);filter:drop-shadow(0px 0px 3px #2496ed)}26.486%{opacity:.30;stroke:#8b949e;transform:translateY(0) scale(1);filter:none}}
 .b1{animation:box1 7s linear infinite} .w1{animation:word1 7s linear infinite} .i1{animation:icon1 7s linear infinite}

