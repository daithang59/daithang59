<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 140" width="100%" height="140" role="img" aria-label="DevSecOps cycle with seven sequentially illuminated stages">
<defs><filter id="blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>
.bgline {stroke:#22272e;stroke-width:4;stroke-linecap:round}
.trail {stroke:#ff9900;stroke-width:7;opacity:.35;filter:url(#blur);stroke-linecap:round;stroke-dasharray:90 670;animation:flow 4.7s linear infinite}
.core {stroke:#ffb83d;stroke-width:3;stroke-dasharray:90 670;stroke-linecap:round;animation:flow 4.7s linear infinite}
@keyframes flow {to {stroke-dashoffset:-760}}
.node {fill:#0d1117;stroke:#30363d;stroke-width:2}
.name {fill:#8b949e;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;text-anchor:middle}
