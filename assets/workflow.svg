<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="150" viewBox="0 0 1120 150" role="img" aria-labelledby="wt wd">
<title id="wt">Continuous delivery engineering workflow</title>
<desc id="wd">Six understated phases, with a moving orange signal highlighting the DevSecOps lifecycle.</desc>
<style>
  .label{font-family:'Consolas','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:1px;fill:#8793a9}
  .step{font-family:'Segoe UI','DejaVu Sans',Arial,sans-serif;font-size:16px;font-weight:650;fill:#d4d9e6}
  .num{font-family:'Consolas','DejaVu Sans Mono',monospace;font-size:11px;fill:#6e7c94}
  .box{fill:#161b27;stroke:#343b4d;stroke-width:1.2}
  @keyframes highlight{0%,12%{stroke:#ff9900;fill:#272117}16%,100%{stroke:#343b4d;fill:#161b27}}
  @keyframes lit{0%,12%{fill:#FFB14D}16%,100%{fill:#d4d9e6}}
  @keyframes dash{to{stroke-dashoffset:-64}}
</style>
<rect x="1" y="1" width="1118" height="148" rx="9" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text class="label" x="28" y="27">ENGINEERING LOOP  /  CONTINUOUS IMPROVEMENT</text>
<text class="label" x="1091" y="27" text-anchor="end">SECURITY IS A STAGE AND A PRACTICE</text>
<path d="M88 92H1032" stroke="#465066" stroke-width="3" stroke-linecap="round"/>
<path d="M88 92H1032" stroke="#f2a22c" stroke-width="3" stroke-dasharray="21 65" opacity=".85" style="animation:dash 5.5s linear infinite"/>
<g><rect class="box" x="34" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear 0s infinite"/>
 <text class="num" x="106" y="59" text-anchor="middle">01</text>
 <text class="step" x="106" y="97" text-anchor="middle" style="animation:lit 12s linear 0s infinite">DESIGN</text></g>
<g><rect class="box" x="212" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear -2s infinite"/>
 <text class="num" x="284" y="59" text-anchor="middle">02</text>
 <text class="step" x="284" y="97" text-anchor="middle" style="animation:lit 12s linear -2s infinite">BUILD</text></g>
<g><rect class="box" x="390" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear -4s infinite"/>
 <text class="num" x="462" y="59" text-anchor="middle">03</text>
 <text class="step" x="462" y="97" text-anchor="middle" style="animation:lit 12s linear -4s infinite">SECURE</text></g>
<g><rect class="box" x="568" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear -6s infinite"/>
 <text class="num" x="640" y="59" text-anchor="middle">04</text>
 <text class="step" x="640" y="97" text-anchor="middle" style="animation:lit 12s linear -6s infinite">DEPLOY</text></g>
<g><rect class="box" x="746" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear -8s infinite"/>
 <text class="num" x="818" y="59" text-anchor="middle">05</text>
 <text class="step" x="818" y="97" text-anchor="middle" style="animation:lit 12s linear -8s infinite">MONITOR</text></g>
<g><rect class="box" x="924" y="68" width="144" height="48" rx="10" style="animation:highlight 12s linear -10s infinite"/>
 <text class="num" x="996" y="59" text-anchor="middle">06</text>
 <text class="step" x="996" y="97" text-anchor="middle" style="animation:lit 12s linear -10s infinite">IMPROVE</text></g>
<text class="label" x="1090" y="138" text-anchor="end">PLAN → AUTOMATE → VERIFY → OPERATE</text></svg>